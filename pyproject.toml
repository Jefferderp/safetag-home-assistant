[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safetag-gateway"
version = "1.0.0"
description = "Read-only Safetag GPS API gateway and Home Assistant integration"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["aiohttp>=3.11.13,<4", "fastapi>=0.115.11,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest-homeassistant-custom-component==0.13.224", "httpx==0.28.1", "ruff==0.17.0", "pycares<5"]

[tool.setuptools.packages.find]
include = ["gateway*", "custom_components*"]

[tool.setuptools.package-data]
gateway = ["*.py"]
"custom_components.safetag" = ["manifest.json", "strings.json", "translations/*.json", "brand/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
